<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://yjvhdkwdylrduunkbykw.supabase.co; connect-src 'self' https://yjvhdkwdylrduunkbykw.supabase.co wss://yjvhdkwdylrduunkbykw.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>CACIH · Afiliación</title>
<meta name="theme-color" content="#173f2c">
<meta name="description" content="CACIH — Un camino hacia la inversión estratégica. Afiliación de socios ahorrantes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="vendor/supabase.js" defer></script>
<style>
/* CACIH: verde bosque (confianza, campo) + dorado (inversión). Una columna; barra superior por rol; ficha imprimible en carta. */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --ink:#17241c; --muted:#5b6a60; --line:#d5dcd3;
  --accent:#173f2c; --accent-2:#2a6b49; --accent-soft:#e2eee6; --gold:#b48a2c; --gold-soft:#f6eedb;
  --ok:#2d7a4b; --warn:#a8691c; --bad:#b23a2e;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1612; --surface:#17211b; --ink:#e5ece7; --muted:#9aa89f; --line:#2b3a31;
  --accent:#7cc79c; --accent-2:#7cc79c; --accent-soft:#1d3226; --gold:#d9b25a; --gold-soft:#2e2717;
  --ok:#7cc79c; --warn:#e2a552; --bad:#ec7d70; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
header.top{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding-top:env(safe-area-inset-top,0px)}
header.top .in{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
@media (prefers-color-scheme:dark){header.top{background:#122c20}}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand svg{flex:0 0 auto}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.04em;display:block;line-height:1}
.brand small{font-size:11.5px;opacity:.8;display:block;margin-top:2px}
.who{display:flex;gap:8px;align-items:center;font-size:13px}
.who button{background:rgba(255,255,255,.12);border:0;color:#fff;padding:6px 10px;font-size:13px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;width:100%}
nav.tabs button{border:0;background:none;color:rgba(255,255,255,.75);font:600 14px var(--f-body);padding:8px 12px;border-radius:8px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:rgba(255,255,255,.16);color:#fff}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:#fff;font-size:12px;margin-left:4px;text-align:center}
.netbar{font-size:12.5px;font-weight:600;padding:6px 12px;text-align:center;background:var(--gold-soft);color:var(--warn)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:24px} h2{font-size:19px} h3{font-size:15px}
.lead{color:var(--muted);margin:4px 0 0}
button,.btn{font:600 14px var(--f-body);border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn-primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
@media (prefers-color-scheme:dark){.btn-primary{color:#0f1612}}
.btn-bad{color:var(--bad);border-color:var(--bad);background:none}
.btn-sm{padding:6px 12px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.t{font-size:13px;font-weight:600}
.t i{color:var(--bad);font-style:normal}
input,select{font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input.mono{font-family:var(--f-mono);letter-spacing:.06em}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:12.5px;color:var(--bad);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:14px;cursor:pointer;background:var(--bg)}
.chips input{width:auto;accent-color:var(--accent-2);margin:0}
.chips label:has(input:checked){border-color:var(--accent-2);background:var(--accent-soft)}
.steps{display:flex;gap:6px;margin:18px 0;overflow-x:auto;padding-bottom:4px}
.steps button{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:6px 10px;font-size:13px;border-radius:20px;color:var(--muted)}
.steps .l{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-family:var(--f-display);font-size:12px}
.steps button.cur{border-color:var(--accent-2);color:var(--ink)}
.steps button.cur .l{background:var(--accent-2);color:#fff}
.steps button.done .l{background:var(--accent-soft);color:var(--accent-2)}
.rowbtns{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.benef{display:grid;grid-template-columns:2fr 1.4fr 1fr 70px 40px;gap:8px;align-items:end}
.benef+.benef{margin-top:10px}
@media (max-width:620px){.benef{grid-template-columns:1fr 1fr;padding-bottom:10px;border-bottom:1px solid var(--line)}.benef .rm{justify-self:end;grid-column:2}}
canvas.sig{width:100%;height:160px;background:#fff;border:1px dashed var(--line);border-radius:8px;touch-action:none;display:block}
.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo img{width:120px;height:76px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:auto;margin-top:4px;accent-color:var(--accent-2)}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:13.5px}
.warnnote{background:var(--gold-soft);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 10px}
.filters button{padding:6px 12px;border-radius:20px;font-size:13px}
.filters button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;padding:14px 16px}
.item .meta{color:var(--muted);font-size:13px;min-width:0}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.p-pend{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.p-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.p-bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.p-q{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:28px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.docs{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.docs figure{margin:0}
.docs img{width:200px;max-width:100%;border-radius:6px;border:1px solid var(--line);background:#fff}
.docs figcaption{font-size:12px;color:var(--muted)}
.log{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
table.plain{width:100%;border-collapse:collapse;font-size:14px}
table.plain td,table.plain th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.plain th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tablewrap{overflow-x:auto}
.param{display:grid;grid-template-columns:1fr 220px;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.param p{margin:2px 0 0;color:var(--muted);font-size:13px}
@media (max-width:560px){.param{grid-template-columns:1fr}}
.auth{max-width:420px;margin:28px auto 0}
.auth .hero{text-align:center;margin-bottom:18px}
.auth .hero b{font-family:var(--f-display);font-size:34px;letter-spacing:.06em;color:var(--accent);display:block;margin-top:8px}
.auth .hero span{color:var(--gold);font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* ===== Ficha (pantalla e impresión) ===== */
.sheet-wrap{overflow-x:auto;margin-top:14px}
.sheet{background:#fff;color:#111;width:100%;min-width:640px;border:1px solid var(--line);border-radius:4px;padding:26px 30px;font-size:12px;line-height:1.38}
.sheet h4{font-family:var(--f-display);font-size:11.5px;margin:11px 0 5px;padding:3px 8px;background:#173f2c;color:#fff;letter-spacing:.05em;text-transform:uppercase;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .hd{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:2px solid #173f2c;padding-bottom:8px}
.sheet .hd .nm{display:flex;gap:10px;align-items:center}
.sheet .hd b{font-family:var(--f-display);font-size:20px;letter-spacing:.06em;color:#173f2c;display:block;line-height:1}
.sheet .hd em{font-style:normal;color:#8a6a1f;font-size:11px;font-weight:600}
.sheet .code{border:1.5px solid #173f2c;padding:5px 10px;text-align:center;font-family:var(--f-mono);font-size:13px}
.sheet table{width:100%;border-collapse:collapse}
.sheet td{border:1px solid #c9d1ca;padding:4px 7px;vertical-align:top}
.sheet td.k{width:33%;background:#f1f4f1;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.sheet .sigs div{text-align:center;min-height:64px;display:flex;flex-direction:column;justify-content:flex-end;font-size:11px}
.sheet .sigs span{border-top:1px solid #333;padding-top:3px}
.sheet .sigs img{max-height:48px;max-width:100%;margin:0 auto 3px}
.sheet .foot{margin-top:10px;font-size:10px;color:#555;display:flex;justify-content:space-between}
.legal{font-size:13px;line-height:1.5;color:var(--ink);text-align:justify;margin:6px 0}
.sheet .hd2{display:grid;grid-template-columns:120px 1fr 96px;gap:12px;align-items:center;border-bottom:2px solid #173f2c;padding-bottom:8px}
.sheet .hd2 .logo{width:120px;height:auto}
.sheet .hd2 .ctr{text-align:center;font-size:11px;line-height:1.35}
.sheet .hd2 .ctr b{font-family:var(--f-display);font-size:18px;color:#173f2c;letter-spacing:.06em}
.sheet .hd2 .nl{font-weight:700;font-size:12.5px;margin:2px 0}
.sheet .foto{width:96px;height:112px;border:1px solid #333;display:grid;place-items:center;color:#777;font-size:11px;overflow:hidden}
.sheet .foto img{width:100%;height:100%;object-fit:cover}
.sheet .tit{display:flex;gap:22px;align-items:center;justify-content:center;margin:8px 0 2px;font-size:12px}
.sheet .tit b{font-size:13px;letter-spacing:.03em}
.sheet .tit2{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;font-size:11px;margin-bottom:2px}
.sheet table.kv td.k{width:20%}
.sheet table.grid3{margin-top:4px}
.sheet table.grid3 td.k{width:auto;text-align:center}
.sheet p.q{margin:4px 0;font-size:11.5px}
.sheet p.legal{font-size:10.5px;line-height:1.4;margin:3px 0;color:#111}
.sheet .sigs .sn{font-size:11.5px;margin-bottom:4px;font-weight:600}
@media print{.sheet h4{break-after:avoid}.sheet table{break-inside:avoid}}
#print{display:none}
#pdfArea{position:fixed;left:-10000px;top:0;width:816px;background:#fff}
#pdfArea .sheet{min-width:0;border:0;border-radius:0;padding:36px 40px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.toolbar .grp{display:flex;gap:8px;flex-wrap:wrap}
.who .on{background:var(--gold);color:#17241c}
@media print{
  @page{size:letter;margin:11mm}
  body{background:#fff}
  header.top,main,.toast,.netbar{display:none!important}
  #print{display:block}
  #print .sheet{border:0;padding:0;min-width:0}
}
</style>
</head>
<body>
<header class="top" id="hdr" hidden><div class="in">
  <div class="brand"><img src="logo-icono.png" width="38" height="38" alt="" style="border-radius:50%;background:#fff">
    <div><b>CACIH</b><small id="lema">Un camino hacia la inversión estratégica</small></div></div>
  <div class="who"><span id="whoName"></span><button id="pushBtn" hidden>Avisos</button><button id="logout">Salir</button></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div></header>
<div class="netbar" id="netbar" hidden></div>
<main class="wrap" id="app"><p class="empty"><span class="spin"></span> Cargando…</p></main>
<div id="print"></div>
<div id="pdfArea" aria-hidden="true"></div>
<div class="toast" id="toast" hidden></div>

<script src="app.js" defer></script>

</body>
</html>
